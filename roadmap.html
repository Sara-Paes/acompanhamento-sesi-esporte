<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roadmap - Sistema SESI Esporte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,sans-serif;background:linear-gradient(180deg,#f7f7f8 0%,#f2f3f5 100%);color:#1f1f22;min-height:100vh}
header{background:rgba(34,34,34,.96);border-bottom:1px solid rgba(255,255,255,.06)}
.header-content{max-width:1280px;margin:0 auto;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px}
.brand h1{font-family:Poppins,sans-serif;font-size:1.1rem;font-weight:700;color:#fff}.brand p{margin-top:4px;color:rgba(255,255,255,.62);font-size:.76rem;text-transform:uppercase;letter-spacing:.12em;font-weight:700}
.back-link{display:inline-flex;align-items:center;justify-content:center;padding:12px 16px;border-radius:14px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.05);color:#fff;text-decoration:none;font-weight:700}
.container{max-width:1280px;margin:0 auto;padding:36px 24px}
.panel{background:linear-gradient(180deg,rgba(255,255,255,.98),rgba(250,250,251,.96));border:1px solid #e4e6ea;border-radius:32px;box-shadow:0 12px 28px rgba(17,17,17,.06);padding:88px 48px;text-align:center}
.eyebrow{display:inline-block;margin-bottom:18px;font-size:.86rem;color:#e30613;text-transform:uppercase;letter-spacing:.28em;font-weight:800}
.title{font-family:Poppins,sans-serif;font-size:clamp(2.2rem,4vw,4rem);line-height:1.04;letter-spacing:-.05em;font-weight:800;margin-bottom:16px}
.subtitle{max-width:760px;margin:0 auto;color:#66707c;font-size:1.08rem;line-height:1.8}
@media(max-width:700px){.panel{padding:64px 24px}.header-content{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>
<header><div class="header-content"><div class="brand"><h1>Sistema SESI Esporte</h1><p>Roadmap</p></div><a class="back-link" href="index.html">Voltar ao sistema</a></div></header>
<main class="container"><section class="panel"><span class="eyebrow">Programa SESI Esporte</span><h2 class="title">Roadmap</h2><p class="subtitle">Página reservada para a construção do roadmap do projeto.</p></section></main>
</body>
</html>
